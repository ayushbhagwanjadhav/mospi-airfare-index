name: Temp - Recalculate CPI Math

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  recalculate-math:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pandas
        run: pip install pandas

      - name: Run CPI Calculator
        run: python core/cpi_calculator.py

      - name: Commit and Push Updated Matrix
        run: |
          git config --global user.name "MoSPI-Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "Recalculated CPI Math (Removed 2026 Outliers)" || exit 0
          git pull --rebase origin main
          git push origin main
